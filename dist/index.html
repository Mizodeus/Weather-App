<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Todo List</title><script defer src=app.bundle.js></script></head><body><div class=app><header class=app-header><h1>Todo List</h1><p>Organize your tasks efficiently</header><nav class=project-nav><div id=project-tabs></div><div class=project-toolbar><button type=button class=btn-delete-project id=delete-project>✕ Delete Project</button><form class=project-create id=project-form><input id=project-name placeholder="Project name" hidden> <button type=button class=btn-add-project id=add-project>+ New Project</button></form></div></nav><section class=todo-list-section><div class=todo-list-header><h2></h2><button class="btn btn-primary">+ Add Todo</button></div><div id=todo-list></div></section></div><div class=modal-overlay><div class=modal><h3>New Todo</h3><form><div class=form-group><label for=todo-title>Title</label> <input id=todo-title placeholder="Enter title"></div><div class=form-group><label for=todo-description>Description</label> <textarea id=todo-description placeholder="Enter description"></textarea></div><div class=form-group><label for=todo-date>Due Date</label> <input type=date id=todo-date></div><div class=form-group><label for=todo-priority>Priority</label> <select id=todo-priority><option value=high>High<option value=medium selected>Medium<option value=low>Low</select></div><div class=form-actions><button type=button class="btn btn-ghost">Cancel</button> <button type=submit class="btn btn-primary">Create</button></div></form></div></div></body></html>
